$kind: http-request
url: "{{baseUrl}}/search?q=*&size=20"
method: GET
queryParams:
  q: "*"
  size: "20"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 1000

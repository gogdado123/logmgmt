$kind: http-request
url: "{{baseUrl}}/stats/timeline?interval=1h"
method: GET
queryParams:
  interval: 1h
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 200", function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 8000

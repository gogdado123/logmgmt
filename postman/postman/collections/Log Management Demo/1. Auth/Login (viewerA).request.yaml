$kind: http-request
description: ล็อกอินและเก็บ token ลงตัวแปร viewerToken อัตโนมัติ
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{viewerUser}}",
      "password": "{{viewerPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", function () { pm.response.to.have.status(200); });
      const j = pm.response.json();
      pm.collectionVariables.set("viewerToken", j.access_token);
    language: text/javascript
order: 2000

$kind: http-request
name: viewerA -> tenant demoB (expect 403)
url: "{{baseUrl}}/search?tenant=demoB"
method: GET
queryParams:
  tenant: demoB
auth:
  type: bearer
  credentials:
    token: "{{viewerToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status is 403", function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 1000

$kind: http-request
url: "{{baseUrl}}/ingest"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tenant": "demoA",
      "source": "api",
      "event_type": "x"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("status is 401", function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 8000

services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - opensearch
  syslog:
    build: ./ingest
    environment:
      - BACKEND_URL=http://backend:8000/ingest
      - SYSLOG_TENANT=demoa
    ports:
      - "514:514/udp"
      - "514:514/tcp"
    depends_on:
      - backend
volumes:
  osdata: